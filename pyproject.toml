[project]
name = "kuairand-recsys"
version = "0.1.0"
description = "Two-stage KuaiRand recommender: ALS retrieval and a CatBoost ranker"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "redis>=6.4.0",
  "qdrant-client>=1.15.0",
  "clickhouse-connect>=0.8.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "mlflow>=3.3.0",
  "numpy>=2.1.0",
  "pandas>=2.3.0",
  "scikit-learn>=1.7.0",
  "implicit>=0.7.2",
  "catboost>=1.2.8",
  "joblib>=1.5.0",
  "prometheus-client>=0.23.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5.0"]
deep = ["torch>=2.8.0"]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "httpx>=0.28.0",
  "ruff>=0.12.0",
  "mypy>=1.17.0",
  "types-redis>=4.6.0.20241004",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["libs", "services", "pipelines"]

[tool.ruff]
line-length = 100
target-version = "py311"
force-exclude = true
exclude = [".venv", "data/raw", "**/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: marks docker-backed integration tests",
]
